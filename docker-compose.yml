services:

  frontend:
    build: ./frontend
    container_name: contact-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: contact-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/contactdb
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: contact-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
